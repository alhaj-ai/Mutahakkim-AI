[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mutahakkim-ai"
version = "0.1.0"
description = "Mutahakkim-AI: Discover GUI capabilities with a VLM, compile them into deterministic YAML artifacts, and replay with zero model calls."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "itsdangerous>=2.2",
  "httpx>=0.27",
  "jinja2>=3.1",
  "playwright>=1.48",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "python-multipart>=0.0.9",
  "pyyaml>=6.0",
  "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.6",
  "pyright>=1.1.390",
]

[project.scripts]
mutahakkim = "computer_use.cli:main"
cu = "computer_use.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/computer_use", "src/mutahakkim"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q --tb=short"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "demo", "operator_console", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
include = ["src", "demo", "operator_console", "tests"]
venvPath = "."
venv = ".venv"
